# ======================
# Server & Runtime
# ======================
# Bind to Render's provided port in prod; default to 8080 locally.
server.port=${PORT:8080}
# Keep your API under /api (matches your frontends).
server.servlet.context-path=/api
# Honor X-Forwarded-* headers behind a proxy (correct HTTPS redirects/links).
server.forward-headers-strategy=framework
# Graceful shutdown for safer deploys.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ======================
# DataSource (PostgreSQL)
# ======================
# Use env vars in prod; fall back to local dev defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/music-reviews-portal-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jbockal}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optional: small HikariCP pool for tiny containers/free tiers
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}

# ======================
# JPA / Hibernate
# ======================
# For dev convenience; prefer Flyway/Liquibase for prod migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Log SQL in dev; disable in prod by setting SPRING_SHOW_SQL=false.
spring.jpa.show-sql=${SPRING_SHOW_SQL:true}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Optional: cleaner SQL logs
spring.jpa.properties.hibernate.format_sql=${SPRING_FORMAT_SQL:false}

# ======================
# Logging
# ======================
# Verbose security logs in dev; set SPRING_SECURITY_LOG_LEVEL=INFO in prod.
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:DEBUG}
# Optional: quiet down Hibernate in prod
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:OFF}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BIND_LOG_LEVEL:OFF}

# ======================
# File Uploads
# ======================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
